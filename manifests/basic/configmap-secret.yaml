# ConfigMap 示例
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  config.json: |
    {
      "database": "mysql",
      "cache": "redis"
    }
---
# Secret 示例 (base64 编码)
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
data:
  DB_PASSWORD: cGFzc3dvcmQxMjM=  # password123
  API_KEY: c2VjcmV0LWtleS0xMjM=  # secret-key-123
